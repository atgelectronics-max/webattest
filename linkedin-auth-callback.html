<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn 授权回调</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { font-size: 18px; margin-bottom: 15px; color: #111; }
        p { font-size: 14px; color: #666; margin: 10px 0; word-break: break-all; }
        .code-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #0a66c2;
            margin-top: 10px;
        }
        .error { color: #d93838; }
    </style>
</head>
<body>

    <div class="card" id="status-card">
        <h2 id="status-title">正在处理 LinkedIn 授权...</h2>
        <p id="status-desc">请稍候，正在获取授权信息。</p>
        <div id="result-container"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');

            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');
            const resultContainer = document.getElementById('result-container');

            // 1. 检查 LinkedIn 是否返回了错误
            if (error) {
                titleEl.innerText = "授权失败";
                titleEl.classList.add('error');
                descEl.innerText = errorDescription || "用户取消了授权或发生未知错误。";
                return;
            }

            // 2. 检查是否存在授权码 code
            if (!code) {
                titleEl.innerText = "无效的请求";
                titleEl.classList.add('error');
                descEl.innerText = "未检测到有效的授权参数 (code)。";
                return;
            }

            // 3. 成功获取 code（不再发送后端，直接在前端展示或进行其他纯前端处理）
            titleEl.innerText = "LinkedIn 授权成功！";
            descEl.innerText = "已成功捕获授权码 (Authorization Code)：";
            
            // 在页面上展示获取到的 code（方便你调试或下一步使用）
            resultContainer.innerHTML = `
                <div class="code-box">code: ${code}</div>
                ${state ? `<div class="code-box" style="margin-top:5px;">state: ${state}</div>` : ''}
            `;

            // 如果你需要在这里直接做前端跳转或其它逻辑，可以写在这里：
            // 例如：window.location.href = '/dashboard?code=' + code;
        });
    </script>
</body>
</html>
